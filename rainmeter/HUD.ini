[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
SkinWidth=430
SkinHeight=236

[Metadata]
Name=CYBER//DECK HUD
Author=Zyared
Information=System readout in the CYBER//DECK style.
Version=1.0

[Variables]
Y=237,36,56
R=255,0,60
C=219,219,224
T=219,219,224
D=146,146,156
Bar=43,18,25
Font=Bahnschrift SemiBold Condensed

; ---------- measures ----------
[mTime]
Measure=Time
Format=%H:%M:%S

[mDate]
Measure=Time
Format=%d.%m.%Y

[mCPU]
Measure=CPU
Processor=0

[mRAM]
Measure=PhysicalMemory
UpdateDivider=2

[mRAMTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=60

[mRAMPercent]
Measure=Calc
Formula=mRAMTotal > 0 ? (mRAM / mRAMTotal * 100) : 0
MinValue=0
MaxValue=100
UpdateDivider=2

[mDiskFree]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=60

[mDiskTotal]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=60

[mDiskPercent]
Measure=Calc
Formula=mDiskTotal > 0 ? ((mDiskTotal - mDiskFree) / mDiskTotal * 100) : 0
MinValue=0
MaxValue=100
UpdateDivider=60

[mNetIn]
Measure=NetIn
Interface=Best

[mNetOut]
Measure=NetOut
Interface=Best

; ---------- frame: dark plate with cut corners ----------
[Plate]
Meter=Shape
X=0
Y=0
Shape=Path Outline | Fill Color 8,8,10,205 | Stroke Color #Y# | StrokeWidth 1.5
Outline=14,1 | LineTo 429,1 | LineTo 429,221 | LineTo 415,235 | LineTo 1,235 | LineTo 1,14 | ClosePath 1

[Accent]
Meter=Shape
X=0
Y=0
Shape=Rectangle 14,62,5,160 | Fill Color #R# | StrokeWidth 0

; ---------- header ----------
[Clock]
Meter=String
MeasureName=mTime
X=20
Y=6
FontFace=#Font#
FontSize=30
FontColor=#Y#
AntiAlias=1

[DateText]
Meter=String
MeasureName=mDate
X=412
Y=10
StringAlign=Right
FontFace=#Font#
FontSize=13
FontColor=#C#
AntiAlias=1

[Status]
Meter=String
Text=SYS ONLINE
X=412
Y=32
StringAlign=Right
FontFace=#Font#
FontSize=13
FontColor=#T#
AntiAlias=1

; ---------- rows ----------
[StyleLabel]
X=30
FontFace=#Font#
FontSize=13
FontColor=#D#
AntiAlias=1

[StyleValue]
X=412
StringAlign=Right
FontFace=#Font#
FontSize=13
FontColor=#Y#
AntiAlias=1

[StyleBar]
X=86
W=250
H=6
BarColor=#Y#
SolidColor=#Bar#
BarOrientation=Horizontal

[CpuLabel]
Meter=String
MeterStyle=StyleLabel
Text=CPU
Y=66

[CpuBar]
Meter=Bar
MeterStyle=StyleBar
MeasureName=mCPU
Y=74

[CpuValue]
Meter=String
MeterStyle=StyleValue
MeasureName=mCPU
Text=%1%
Y=66

[RamLabel]
Meter=String
MeterStyle=StyleLabel
Text=RAM
Y=98

[RamBar]
Meter=Bar
MeterStyle=StyleBar
MeasureName=mRAMPercent
Y=106

[RamValue]
Meter=String
MeterStyle=StyleValue
MeasureName=mRAMPercent
Text=%1%
NumOfDecimals=0
Y=98

[DiskLabel]
Meter=String
MeterStyle=StyleLabel
Text=C:
Y=130

[DiskBar]
Meter=Bar
MeterStyle=StyleBar
MeasureName=mDiskPercent
BarColor=#R#
Y=138

[DiskValue]
Meter=String
MeterStyle=StyleValue
MeasureName=mDiskPercent
Text=%1%
NumOfDecimals=0
Y=130

[DownLabel]
Meter=String
MeterStyle=StyleLabel
Text=NET IN
Y=164

[DownValue]
Meter=String
MeterStyle=StyleValue
MeasureName=mNetIn
Text=%1B/s
AutoScale=1
NumOfDecimals=1
FontColor=#C#
Y=164

[UpLabel]
Meter=String
MeterStyle=StyleLabel
Text=NET OUT
Y=192

[UpValue]
Meter=String
MeterStyle=StyleValue
MeasureName=mNetOut
Text=%1B/s
AutoScale=1
NumOfDecimals=1
FontColor=#C#
Y=192
